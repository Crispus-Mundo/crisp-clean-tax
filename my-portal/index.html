<script>
// Forwards to the client portal. Nov 6, 2026: keeps portal shortcuts (?go=..., &sid=..., ?page=...) so links in emails open the right page.
(function () {
  var P = "https://script.google.com/macros/s/AKfycbww5S-QVvXhuxUznEo-zGx_xjJJ00JtcM6avEdLEl-jp6VPQZfaYGqhJuwNxLPwA7tz/exec";
  var q = new URLSearchParams(location.search), keep = new URLSearchParams();
  ["go", "sid", "page", "t", "s", "r"].forEach(function (k) { var v = q.get(k); if (v && /^[A-Za-z0-9_\-.]{1,120}$/.test(v)) keep.set(k, v); });
  var s = keep.toString();
  location.replace(P + (s ? "?" + s : ""));
})();
</script></head>
